name: Build and Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Release Tag"
                required: false
                default: ""
                type: string

permissions:
    contents: write

jobs:
    build:
        name: Build and Release Binaries
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Go with legacy Windows support
              env:
                  GO_LEGACY_VERSION: 1.27.3-1
                  GO_LEGACY_SHA256: 069ceddac4917c528be492e560bb71bcf5c8ed5ff5d952ce1c8519e9b169228e
              run: |
                  archive="go-legacy-win7-${GO_LEGACY_VERSION}.linux_amd64.tar.gz"
                  url="https://github.com/thongtech/go-legacy-win7/releases/download/v${GO_LEGACY_VERSION}/${archive}"
                  curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/$archive"
                  echo "${GO_LEGACY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --status
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
                  echo "GO=$RUNNER_TEMP/go-legacy-win7/bin/go" >> "$GITHUB_ENV"
                  "$RUNNER_TEMP/go-legacy-win7/bin/go" version

            - name: Install Windows cross compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64
                  x86_64-w64-mingw32-gcc --version

            - name: Run Make
              run: |
                  echo "Building..."

                  make all

            - name: Prepare Assets and Tag
              id: prep
              run: |
                  mkdir -p release_dist

                  zip -j release_dist/timesync-linux-amd64.zip bin/timesync-linux-amd64
                  zip -j release_dist/timesync-windows-amd64.zip bin/timesync-windows-amd64.exe

                  INPUT_TAG="${{ github.event.inputs.release_tag }}"
                  if [ -n "$INPUT_TAG" ]; then
                    TAG_NAME="$INPUT_TAG"
                  else
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    TAG_NAME="rolling-${SHORT_SHA}"
                  fi

                  echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.prep.outputs.tag_name }}
                  files: release_dist/*
                  generate_release_notes: true
                  overwrite_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
