name: Build and Release

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: "Release Tag"
                required: false
                default: ""
                type: string

permissions:
    contents: write

jobs:
    build:
        name: Build and Release Binaries
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"
                  cache: true

            - name: Install Windows cross compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64
                  x86_64-w64-mingw32-gcc --version

            - name: Run Make
              run: |
                  echo "Building..."

                  make all

            - name: Prepare Assets and Tag
              id: prep
              run: |
                  mkdir -p release_dist

                  zip -j release_dist/timesync-linux-amd64.zip bin/timesync-linux-amd64
                  zip -j release_dist/timesync-windows-amd64.zip bin/timesync-windows-amd64.exe

                  INPUT_TAG="${{ github.event.inputs.release_tag }}"
                  if [ -n "$INPUT_TAG" ]; then
                    TAG_NAME="$INPUT_TAG"
                  else
                    SHORT_SHA=$(git rev-parse --short HEAD)
                    TAG_NAME="rolling-${SHORT_SHA}"
                  fi

                  echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.prep.outputs.tag_name }}
                  files: release_dist/*
                  generate_release_notes: true
                  overwrite_files: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
